services:
  postgres:
    # Contenedor de la base de datos PostgreSQL.
    image: postgres:16
    container_name: edtech-postgres
    environment:
      POSTGRES_DB: edtech_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Conserva la informacion aunque el contenedor se reinicie.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Verifica que PostgreSQL este listo antes de arrancar el backend.
      test: ["CMD-SHELL", "pg_isready -U postgres -d edtech_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Servicio del backend en FastAPI.
    build:
      context: ./backend
    container_name: edtech-backend
    environment:
      # Dentro de Docker, el backend se conecta a PostgreSQL usando el nombre del servicio "postgres".
      DATABASE_URL: postgresql+psycopg://neondb_owner:npg_k3osPCvZcMz5@ep-square-credit-aqcyo0wx.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
      # Permite que el frontend abierto en el navegador consuma la API.
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      # Monta el codigo fuente para reflejar cambios sin reconstruir todo el contenedor.
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Servicio del frontend en React con Vite.
    build:
      context: ./frontend
    container_name: edtech-frontend
    environment:
      # El navegador del usuario accede al backend por localhost:8000.
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      # Monta el codigo del frontend para desarrollo en caliente.
      - ./frontend:/app
      # Guarda node_modules dentro del volumen del contenedor.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  # Volumen persistente para los datos de PostgreSQL.
  postgres_data:
  # Volumen para las dependencias del frontend dentro del contenedor.
  frontend_node_modules:
